name: ols
displayName: OLS
description: Ontology Lookup Service — search and browse biomedical ontologies (GO, EFO, HPO, etc.)
tags:
  - ontology
  - terminology
  - ols
  - controlled-vocabulary
baseUrl: https://www.ebi.ac.uk/ols4/api
tools:
  searchTerms:
    description: Search across ontologies for terms matching a query
    tags:
      - term-search
      - ontology-search
    method: GET
    path: /search
    params:
      query:
        type: string
        required: true
        mapsTo: q
        description: Search term (e.g. "apoptosis", "diabetes", "kinase")
      rows:
        type: integer
        default: 10
        description: Number of results to return
    response:
      format: json
      pick:
        - response.numFound
        - response.docs[].label
        - response.docs[].iri
        - response.docs[].obo_id
        - response.docs[].ontology_name
        - response.docs[].description
        - response.docs[].short_form
        - response.docs[].type
  getOntology:
    description: Get metadata about a specific ontology
    tags:
      - ontology-info
      - ontology-metadata
    method: GET
    path: /ontologies/{id}
    params:
      id:
        type: string
        required: true
        description: Ontology identifier (e.g. go, efo, hp, mondo)
    response:
      format: json
      pick:
        - ontologyId
        - config.title
        - config.description
        - config.preferredPrefix
        - config.homepage
        - config.version
        - numberOfTerms
        - numberOfProperties
tests:
  searchTerms:
    - name: searches for apoptosis terms
      params:
        query: apoptosis
      assert:
        - path: response.docs
          minLength: 1
        - path: response.docs.0.iri
  getOntology:
    - name: gets GO ontology metadata
      params:
        id: go
      assert:
        - path: ontologyId
          equals: go
        - path: numberOfTerms
          gt: 0
