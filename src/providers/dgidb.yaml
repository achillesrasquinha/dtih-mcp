name: dgidb
displayName: DGIdb
description: Drug-Gene Interaction Database — mining drug-gene interaction data
tags: [drug, gene, interaction, pharmacogenomics, druggable-genome]
baseUrl: https://dgidb.org/api/graphql
protocol: graphql

tools:
  search:
    description: Search for drug-gene interactions by gene name
    tags: [drug-gene-search, interaction-search]
    query: |
      query ($names: [String!]!) {
        genes(names: $names) {
          nodes {
            name
            longName
            interactions {
              drug { name conceptId }
              interactionTypes { type directionality }
              evidenceScore
            }
          }
        }
      }
    params:
      names:
        type: array
        required: true
        description: Gene name(s) to search for interactions (e.g. ["EGFR"])

  getGene:
    description: Get gene details including drug interactions
    tags: [gene-info, drug-gene-info]
    query: |
      query ($names: [String!]!) {
        genes(names: $names) {
          nodes {
            name
            longName
            geneCategories { name }
            interactions {
              drug { name conceptId }
              evidenceScore
            }
          }
        }
      }
    params:
      names:
        type: array
        required: true
        description: Gene name(s) to look up (e.g. ["EGFR"])
