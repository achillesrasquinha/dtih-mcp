name: pubtator
displayName: PubTator
description: PubTator3 biomedical text mining — named entity recognition and annotation of PubMed articles
tags: [text-mining, ner, annotation, pubtator, biomedical-nlp]
baseUrl: https://www.ncbi.nlm.nih.gov/research/pubtator3-api

tools:
  annotate:
    description: Get NER annotations for a PubMed article by PMID (returns BioC JSON)
    tags: [annotation, ner-annotation]
    method: GET
    path: /publications/export/biocjson
    params:
      pmid:
        type: string
        required: true
        mapsTo: pmids
        description: PubMed ID (e.g. "35153516")
    response:
      format: json

  search:
    description: Search PubTator for annotated articles by text query
    tags: [article-search, entity-search]
    method: GET
    path: /search/
    params:
      query:
        type: string
        required: true
        mapsTo: text
        description: Search text (e.g. "BRCA1 cancer")
      sort:
        type: string
        default: "score desc"
        description: Sort order (e.g. "score desc", "date desc")
    response:
      format: json
