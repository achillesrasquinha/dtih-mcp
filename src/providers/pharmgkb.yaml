name: pharmgkb
displayName: PharmGKB (CPIC)
description: CPIC pharmacogenomics knowledge base — drug-gene pairs, clinical guidelines, and pharmacogenomic recommendations
tags: [pharmacogenomics, drug-gene, pharmgkb, clinical, pgx]
baseUrl: https://api.cpicpgx.org/v1

tools:
  searchDrugs:
    description: Search for drugs by name in the CPIC pharmacogenomics database
    tags: [drug-search, pgx-drug]
    method: GET
    path: /drug
    params:
      name:
        type: string
        required: true
        mapsTo: name
        description: Drug name filter using PostgREST eq operator (e.g. "eq.warfarin")
    response:
      format: json

  getDrugGenePairs:
    description: Get drug-gene interaction pairs for a specific drug
    tags: [drug-gene-pairs, pgx-pairs]
    method: GET
    path: /pair
    params:
      drugid:
        type: string
        required: true
        mapsTo: drugid
        description: Drug ID filter using PostgREST eq operator (e.g. "eq.RxNorm:11289" for warfarin)
    response:
      format: json
