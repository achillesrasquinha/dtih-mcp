name: ensembl
displayName: Ensembl
description: Genome browser and annotation database
tags:
  - gene
  - genome
  - annotation
  - sequence
  - ensembl
  - variant
baseUrl: https://rest.ensembl.org
headers:
  Content-Type: application/json
rateLimit:
  requestsPerSecond: 15
tools:
  lookupSymbol:
    description: Look up a gene by symbol and species
    tags:
      - gene-lookup
      - symbol
    method: GET
    path: /lookup/symbol/{species}/{symbol}
    params:
      symbol:
        type: string
        required: true
        description: Gene symbol (e.g. BRCA2)
      species:
        type: string
        default: homo_sapiens
        description: Species name
    response:
      format: json
      pick:
        - "id"
        - "display_name"
        - "description"
        - "biotype"
        - "species"
        - "seq_region_name"
        - "start"
        - "end"
  getSequence:
    description: Get sequence for an Ensembl stable ID
    tags:
      - sequence-fetch
      - nucleotide
      - protein
    method: GET
    path: /sequence/id/{id}
    params:
      id:
        type: string
        required: true
        description: Ensembl stable ID (e.g. ENSG00000139618)
    response:
      format: json
      pick:
        - "id"
        - "desc"
        - "molecule"
        - "query"
        - "seq"
        - "version"
tests:
  lookupSymbol:
    - name: looks up BRCA2 gene
      params:
        symbol: BRCA2
        species: homo_sapiens
      assert:
        - path: id
        - path: display_name
          equals: BRCA2
  getSequence:
    - name: gets sequence for an Ensembl ID
      params:
        id: ENSG00000139618
      assert:
        - path: seq
        - path: id
          equals: ENSG00000139618
