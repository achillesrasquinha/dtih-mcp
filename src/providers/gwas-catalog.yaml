name: gwas-catalog
displayName: GWAS Catalog
description: NHGRI-EBI Catalog of genome-wide association studies
tags:
  - gwas
  - genetic-associations
  - snp
  - disease-traits
  - ebi
baseUrl: https://www.ebi.ac.uk/gwas/rest/api
tools:
  search:
    description: Search GWAS Catalog studies by disease trait name
    tags:
      - gwas-search
      - association-search
    method: GET
    path: /studies/search/findByDiseaseTrait
    params:
      query:
        type: string
        required: true
        mapsTo: diseaseTrait
        description: Disease trait name (e.g. "diabetes", "asthma")
      page:
        type: integer
        default: 0
        description: Page number (zero-based)
      size:
        type: integer
        default: 5
        description: Number of results per page
    response:
      format: json
      fields:
        - _embedded.studies[].accessionId
        - _embedded.studies[].diseaseTrait.trait
        - _embedded.studies[].initialSampleSize
        - _embedded.studies[].snpCount
        - _embedded.studies[].publicationInfo.pubmedId
        - _embedded.studies[].publicationInfo.title
        - _embedded.studies[].publicationInfo.publication
        - _embedded.studies[].publicationInfo.author.fullname
  getStudy:
    description: Get GWAS study details by study accession ID
    tags:
      - study-info
      - gwas-study
    method: GET
    path: /studies/{studyId}
    params:
      studyId:
        type: string
        required: true
        description: GWAS study accession (e.g. "GCST90038633")
    response:
      format: json
      fields:
        - accessionId
        - diseaseTrait.trait
        - initialSampleSize
        - replicationSampleSize
        - snpCount
        - publicationInfo.pubmedId
        - publicationInfo.title
        - publicationInfo.publication
        - publicationInfo.author.fullname
        - genotypingTechnologies[].genotypingTechnology
tests:
  search:
    - name: searches for diabetes studies by trait
      params:
        query: diabetes
      assert:
        - path: _embedded.studies
          minLength: 1
  getStudy:
    - name: gets a specific GWAS study by accession
      params:
        studyId: GCST90038633
      assert:
        - anyOf:
            - accessionId
            - diseaseTrait
