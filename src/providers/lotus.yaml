name: lotus
displayName: LOTUS
description: Natural products database — open knowledge on natural compounds and their biological sources
tags:
  - natural-products
  - chemistry
  - compounds
  - lotus
  - metabolites
baseUrl: https://lotus.naturalproducts.net/api
tools:
  search:
    description: Search natural products by name or SMILES
    tags:
      - natural-product-search
      - compound-search
    method: GET
    path: /search/simple
    params:
      query:
        type: string
        required: true
        description: Search query — compound name or SMILES string
    response:
      format: json
      fields:
        - "naturalProducts[].lotus_id"
        - "naturalProducts[].wikidata_id"
        - "naturalProducts[].smiles"
        - "naturalProducts[].contains_sugar"
        - "naturalProducts[].heavy_atom_number"
  getCompound:
    description: Get compound details by LOTUS ID
    tags:
      - compound-details
      - natural-product
    method: GET
    path: /compound/{lotusId}
    params:
      lotusId:
        type: string
        required: true
        description: LOTUS compound identifier
    response:
      format: json
tests:
  search:
    - name: searches for caffeine
      params:
        query: caffeine
      assert:
        - path: naturalProducts
          minLength: 1
        - path: naturalProducts.0.lotus_id
  getCompound:
    - name: gets compound details by LOTUS ID
      params:
        lotusId: Q27113900
      assert:
        - path: lotus_id
