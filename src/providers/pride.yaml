name: pride
displayName: PRIDE
description: PRIDE proteomics archive — mass spectrometry proteomics data repository
tags: [proteomics, mass-spectrometry, pride, peptides]
baseUrl: https://www.ebi.ac.uk/pride/ws/archive/v2

tools:
  searchProjects:
    description: Search PRIDE proteomics projects by keyword
    tags: [project-search, proteomics-search]
    method: GET
    path: /search/autocomplete
    params:
      query:
        type: string
        required: true
        mapsTo: keyword
        description: Search keyword (e.g. "cancer", "phosphoproteomics")
      limit:
        type: integer
        default: 10
        description: Maximum number of results
    response:
      format: json

  getProject:
    description: Get a specific PRIDE project by accession
    tags: [project-info, dataset-info]
    method: GET
    path: /projects/{accession}
    params:
      accession:
        type: string
        required: true
        description: PRIDE project accession (e.g. PXD000001)
    response:
      format: json
