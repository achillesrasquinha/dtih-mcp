name: string
displayName: STRING
description: Protein-protein interaction network database
tags:
  - protein
  - interaction
  - network
  - ppi
  - functional-association
baseUrl: https://string-db.org/api
tools:
  getInteractions:
    description: Get protein-protein interaction network for given protein(s)
    tags:
      - interaction-network
      - ppi
    method: GET
    path: /json/network
    params:
      identifiers:
        type: string
        required: true
        description: Protein name(s) (e.g. "TP53", "CDK2%0dCDK3" for multiple)
      species:
        type: integer
        default: 9606
        description: NCBI taxon ID (9606 for human)
      limit:
        type: integer
        default: 10
        description: Maximum number of interaction partners to return
    response:
      format: json
      pick:
        - "[].stringId_A"
        - "[].stringId_B"
        - "[].preferredName_A"
        - "[].preferredName_B"
        - "[].score"
        - "[].ncbiTaxonId"
  getEnrichment:
    description: Get functional enrichment analysis for protein(s)
    tags:
      - enrichment
      - go-terms
      - pathways
    method: GET
    path: /json/enrichment
    params:
      identifiers:
        type: string
        required: true
        description: Protein name(s) (e.g. "TP53", "CDK2%0dCDK3" for multiple)
      species:
        type: integer
        default: 9606
        description: NCBI taxon ID (9606 for human)
    response:
      format: json
      pick:
        - "[].category"
        - "[].term"
        - "[].description"
        - "[].number_of_genes"
        - "[].p_value"
        - "[].fdr"
        - "[].preferredNames"
tests:
  getInteractions:
    - name: gets protein-protein interactions for TP53
      params:
        identifiers: TP53
      assert:
        - isArray: true
          minLength: 1
        - anyOf:
            - 0.preferredName_A
            - 0.stringId_A
  getEnrichment:
    - name: gets functional enrichment for TP53
      params:
        identifiers: TP53
      assert:
        - isArray: true
          minLength: 1
        - anyOf:
            - 0.term
            - 0.category
