name: lipidmaps
displayName: LIPID MAPS
description: LIPID MAPS Structure Database for lipid classification and structures
tags: [lipids, lipidomics, metabolites, structures, chemistry]
baseUrl: https://www.lipidmaps.org/rest

tools:
  getCompound:
    description: Get lipid compound details by LIPID MAPS ID
    tags: [lipid-info, compound-info]
    method: GET
    path: /compound/lm_id/{lmId}/all/json
    params:
      lmId:
        type: string
        required: true
        description: LIPID MAPS identifier (e.g. LMFA01010001)
    response:
      format: json

  getByName:
    description: Search lipids by abbreviated chain name
    tags: [lipid-search, name-search]
    method: GET
    path: /compound/abbrev_chains/{name}/all/json
    params:
      name:
        type: string
        required: true
        description: Abbreviated lipid chain name (e.g. DHA, AA, EPA)
    response:
      format: json
