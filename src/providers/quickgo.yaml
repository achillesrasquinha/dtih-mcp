name: quickgo
displayName: QuickGO
description: Gene Ontology browser — fast access to GO term information (EBI)
tags:
  - gene-ontology
  - go
  - annotation
  - function
  - quickgo
baseUrl: https://www.ebi.ac.uk/QuickGO/services
tools:
  search:
    description: Search Gene Ontology terms by keyword
    tags:
      - go-search
      - ontology-search
    method: GET
    path: /ontology/go/search
    params:
      query:
        type: string
        required: true
        mapsTo: query
        description: Search keyword (e.g. "apoptosis", "kinase activity")
      limit:
        type: integer
        default: 10
        description: Maximum number of results
    response:
      format: json
      pick:
        - numberOfHits
        - results[].id
        - results[].name
        - results[].definition.text
        - results[].aspect
        - results[].isObsolete
  getTerm:
    description: Get a Gene Ontology term by GO ID
    tags:
      - go-term
      - ontology-info
    method: GET
    path: /ontology/go/terms/{goId}
    params:
      goId:
        type: string
        required: true
        description: GO term ID (e.g. GO:0006915)
    response:
      format: json
      pick:
        - numberOfHits
        - results[].id
        - results[].name
        - results[].definition.text
        - results[].aspect
        - results[].synonyms[].name
        - results[].synonyms[].type
        - results[].isObsolete
tests:
  search:
    - name: searches for apoptosis GO terms
      params:
        query: apoptosis
      assert:
        - path: numberOfHits
          gt: 0
        - path: results
          minLength: 1
        - path: results.0.name
  getTerm:
    - name: gets GO term GO:0006915 (apoptotic process)
      params:
        goId: GO:0006915
      assert:
        - path: numberOfHits
          gte: 1
        - path: results.0.id
          equals: GO:0006915
        - path: results.0.name
          equals: apoptotic process
