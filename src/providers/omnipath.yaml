name: omnipath
displayName: OmniPath
description: OmniPath — comprehensive signaling network and enzyme-substrate interactions
tags:
  - signaling
  - interactions
  - omnipath
  - pathways
  - network
baseUrl: https://omnipathdb.org
tools:
  getInteractions:
    description: Get signaling interactions for a gene from the OmniPath database
    tags:
      - interaction-search
      - signaling-network
    method: GET
    path: /interactions
    params:
      partners:
        type: string
        required: true
        description: Gene symbol to query (e.g. TP53, EGFR)
      genesymbols:
        type: string
        default: yes
        description: Return gene symbols instead of UniProt IDs
      limit:
        type: integer
        default: 25
        description: Maximum number of interactions
      format:
        type: string
        default: json
        description: Response format (json or tsv)
    response:
      format: json
      fields:
        - '[].source_genesymbol'
        - '[].target_genesymbol'
        - '[].is_directed'
        - '[].is_stimulation'
        - '[].is_inhibition'
        - '[].consensus_direction'
        - '[].consensus_stimulation'
        - '[].consensus_inhibition'
  getEnzSubstrate:
    description: Get enzyme-substrate relationships for a gene
    tags:
      - enzyme-substrate
      - phosphorylation
    method: GET
    path: /enzsub
    params:
      partners:
        type: string
        required: true
        description: Gene symbol to query (e.g. TP53, AKT1)
      genesymbols:
        type: string
        default: yes
        description: Return gene symbols instead of UniProt IDs
      limit:
        type: integer
        default: 25
        description: Maximum number of results
      format:
        type: string
        default: json
        description: Response format (json or tsv)
    response:
      format: json
      fields:
        - '[].enzyme_genesymbol'
        - '[].substrate_genesymbol'
        - '[].residue_type'
        - '[].residue_offset'
        - '[].modification'
tests:
  getInteractions:
    - name: gets signaling interactions for TP53
      params:
        partners: TP53
        limit: 5
      assert:
        - isArray: true
        - anyOf:
            - 0.source_genesymbol
            - 0.target_genesymbol
  getEnzSubstrate:
    - name: gets enzyme-substrate relationships for AKT1
      params:
        partners: AKT1
        limit: 5
      assert:
        - isArray: true
