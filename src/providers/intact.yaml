name: intact
displayName: IntAct
description: Molecular interaction database — curated protein-protein interactions
tags:
  - interaction
  - protein
  - molecular
  - binding
  - intact
baseUrl: https://www.ebi.ac.uk/intact/ws
tools:
  search:
    description: Search IntAct for molecular interactions by gene or protein name
    tags:
      - interaction-search
      - protein-interaction
    method: GET
    path: /interaction/findInteractions/{query}
    params:
      query:
        type: string
        required: true
        description: Gene or protein name to search (e.g. "TP53", "BRCA1")
      page:
        type: integer
        default: 0
      pageSize:
        type: integer
        default: 10
    response:
      format: json
      fields:
        - content[].ac
        - content[].moleculeA
        - content[].moleculeB
        - content[].uniqueIdA
        - content[].uniqueIdB
        - content[].typeA
        - content[].typeB
        - content[].taxIdA
        - content[].taxIdB
        - content[].miscore
  findInteractor:
    description: Find interactor details by gene or protein name
    tags:
      - interactor-search
      - protein-info
    method: GET
    path: /interactor/findInteractor/{query}
    params:
      query:
        type: string
        required: true
        description: Gene or protein name (e.g. "TP53")
      page:
        type: integer
        default: 0
      pageSize:
        type: integer
        default: 10
    response:
      format: json
      fields:
        - content[].interactorAc
        - content[].interactorName
        - content[].interactorPreferredIdentifier
        - content[].interactorDescription
        - content[].interactorType
        - content[].interactorSpecies
        - content[].interactorTaxId
        - content[].interactionCount
tests:
  search:
    - name: searches for TP53 interactions
      params:
        query: P04637
      assert:
        - path: content
          minLength: 1
        - anyOf:
            - content.0.moleculeA
            - content.0.moleculeB
  findInteractor:
    - name: finds interactor details for TP53
      params:
        query: TP53
      assert:
        - path: content
          minLength: 1
        - path: content.0.interactorName
