name: geneontology
displayName: Gene Ontology
description: Gene Ontology API — GO terms, annotations, and bioentity information
tags: [gene-ontology, go, functional-annotation, biological-process]
baseUrl: https://api.geneontology.org/api

tools:
  search:
    description: Search Gene Ontology for terms by keyword using autocomplete
    tags: [go-term-search, ontology-search]
    method: GET
    path: /search/entity/autocomplete/{query}
    params:
      query:
        type: string
        required: true
        description: Search text (e.g. "apoptosis", "cell cycle")
      rows:
        type: integer
        default: 10
        description: Number of results to return
    response:
      format: json

  getTerm:
    description: Get detailed information about a specific GO term
    tags: [go-term-detail, ontology-term]
    method: GET
    path: /ontology/term/{go_id}
    params:
      go_id:
        type: string
        required: true
        description: GO term identifier (e.g. GO:0006915 for apoptotic process)
    response:
      format: json
