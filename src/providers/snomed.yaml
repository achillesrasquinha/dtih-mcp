name: snomed
displayName: SNOMED CT
description: SNOMED CT clinical terminology via FHIR terminology server — look up and search clinical concepts
tags: [terminology, snomed, clinical, medical-coding, ontology]
baseUrl: https://tx.fhir.org/r4
headers:
  Accept: application/fhir+json

tools:
  searchConcepts:
    description: Search SNOMED CT concepts by term using FHIR ValueSet expansion
    tags: [concept-search, terminology-search]
    method: GET
    path: /ValueSet/$expand
    params:
      term:
        type: string
        required: true
        mapsTo: filter
        description: Search term (e.g. "diabetes", "myocardial infarction")
      count:
        type: integer
        default: 10
        description: Number of results to return
      url:
        type: string
        default: "http://snomed.info/sct?fhir_vs"
        description: ValueSet URL for SNOMED CT
      _format:
        type: string
        default: json
        description: Response format
    response:
      format: json

  getConcept:
    description: Look up a specific SNOMED CT concept by code
    tags: [concept-lookup, code-lookup]
    method: GET
    path: /CodeSystem/$lookup
    params:
      code:
        type: string
        required: true
        description: SNOMED CT concept code (e.g. "73211009" for diabetes mellitus)
      system:
        type: string
        default: "http://snomed.info/sct"
        description: Code system URI
      _format:
        type: string
        default: json
        description: Response format
    response:
      format: json
