name: gprofiler
displayName: g:Profiler
description: g:Profiler — functional enrichment and gene ID conversion
tags: [enrichment, functional-analysis, gprofiler, gene-ontology, pathways]
baseUrl: https://biit.cs.ut.ee/gprofiler

tools:
  analyze:
    description: Run functional enrichment analysis on a list of genes
    tags: [enrichment-analysis, gene-set-analysis]
    method: POST
    path: /api/gost/profile/
    params:
      organism:
        type: string
        default: hsapiens
        description: Organism identifier (e.g. hsapiens, mmusculus)
      query:
        type: array
        required: true
        description: List of gene symbols or IDs (e.g. ["BRCA1","TP53","EGFR"])
    response:
      format: json

  convert:
    description: Convert gene identifiers between naming conventions
    tags: [gene-id-conversion, identifier-mapping]
    method: POST
    path: /api/convert/convert/
    params:
      organism:
        type: string
        default: hsapiens
        description: Organism identifier (e.g. hsapiens, mmusculus)
      query:
        type: array
        required: true
        description: List of gene identifiers to convert
      target:
        type: string
        default: ENSG
        description: Target namespace (e.g. ENSG, ENTREZGENE_ACC, UNIPROTSWISSPROT)
    response:
      format: json
