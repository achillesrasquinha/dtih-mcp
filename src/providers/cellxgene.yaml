name: cellxgene
displayName: CELLxGENE
description: CZ CELLxGENE Discover — single-cell datasets and gene expression
tags:
  - single-cell
  - rna-seq
  - gene-expression
  - cellxgene
  - cziscience
baseUrl: https://api.cellxgene.cziscience.com
tools:
  getCollections:
    description: List dataset collections
    tags:
      - collections
      - datasets
    method: GET
    path: /curation/v1/collections
    params: {}
    response:
      format: json
      pick:
        - "[].collection_id"
        - "[].name"
        - "[].description"
        - "[].doi"
        - "[].contact_name"
        - "[].consortia"
        - "[].published_at"
  getCollection:
    description: Get collection details by ID
    tags:
      - collection-detail
    method: GET
    path: /curation/v1/collections/{collectionId}
    params:
      collectionId:
        type: string
        required: true
        description: Collection identifier
    response:
      format: json
      pick:
        - collection_id
        - name
        - description
        - doi
        - contact_name
        - consortia
        - datasets[].dataset_id
        - datasets[].title
        - datasets[].tissue
        - datasets[].disease
        - datasets[].organism
        - datasets[].cell_count
        - datasets[].assay
  getDatasets:
    description: List datasets
    tags:
      - datasets
      - single-cell
    method: GET
    path: /curation/v1/datasets
    params: {}
    response:
      format: json
      pick:
        - "[].dataset_id"
        - "[].title"
        - "[].collection_id"
        - "[].collection_name"
        - "[].cell_count"
        - "[].organism"
        - "[].tissue"
        - "[].disease"
        - "[].assay"
tests:
  getCollections:
    - name: lists dataset collections
      params: {}
      assert:
        - isArray: true
