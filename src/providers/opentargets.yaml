name: opentargets
displayName: Open Targets
description: Drug target identification and prioritization platform
tags:
  - drug-targets
  - disease-associations
  - genetics
  - opentargets
baseUrl: https://api.platform.opentargets.org/api/v4/graphql
protocol: graphql
tools:
  searchTarget:
    description: Search for drug targets by keyword
    tags:
      - target-search
      - gene-search
    query: |
      query($queryString: String!) {
        search(queryString: $queryString, entityNames: ["target"], page: {size: 5, index: 0}) {
          total
          hits {
            id
            name
            description
          }
        }
      }
    params:
      queryString:
        type: string
        required: true
        description: Search keyword (e.g. EGFR, BRAF, insulin)
  getTarget:
    description: Get target details and top associated diseases
    tags:
      - target-info
      - disease-association
    query: |
      query($ensemblId: String!) {
        target(ensemblId: $ensemblId) {
          id
          approvedSymbol
          approvedName
          biotype
          associatedDiseases(page: {size: 5, index: 0}) {
            count
            rows {
              disease {
                id
                name
              }
              score
            }
          }
        }
      }
    params:
      ensemblId:
        type: string
        required: true
        description: Ensembl gene ID (e.g. ENSG00000146648 for EGFR)
tests:
  searchTarget:
    - name: searches for EGFR target
      params:
        queryString: EGFR
      assert:
        - path: search.total
          gt: 0
        - path: search.hits
          minLength: 1
        - path: search.hits.0.name
  getTarget:
    - name: gets target details with disease associations
      params:
        ensemblId: ENSG00000146648
      assert:
        - path: target.approvedSymbol
          equals: EGFR
        - path: target.associatedDiseases.count
          gt: 0
