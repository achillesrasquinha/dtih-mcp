name: gdc
displayName: GDC
description: NCI Genomic Data Commons — cancer genomics data from TCGA and other programs
tags:
  - cancer
  - genomics
  - tcga
  - gdc
  - tumor
baseUrl: https://api.gdc.cancer.gov
tools:
  searchCases:
    description: Search cancer cases in the Genomic Data Commons
    tags:
      - case-search
      - cancer-cases
    method: GET
    path: /cases
    params:
      filters:
        type: string
        description: JSON-encoded filter object (e.g. {"op":"in","content":{"field":"primary_site","value":["Lung"]}})
      fields:
        type: string
        default: case_id,primary_site,disease_type
        description: Comma-separated fields to return
      size:
        type: integer
        default: 10
        description: Number of results
    response:
      format: json
  searchGenes:
    description: Search genes in the Genomic Data Commons
    tags:
      - gene-search
      - cancer-genes
    method: GET
    path: /genes
    params:
      fields:
        type: string
        default: gene_id,symbol,biotype,description
        description: Comma-separated fields to return
      size:
        type: integer
        default: 10
        description: Number of results
    response:
      format: json
  searchProjects:
    description: Search cancer research projects in GDC
    tags:
      - project-search
      - cancer-projects
    method: GET
    path: /projects
    params:
      fields:
        type: string
        default: project_id,name,primary_site,disease_type
        description: Comma-separated fields to return
      size:
        type: integer
        default: 10
        description: Number of results
    response:
      format: json
tests:
  searchCases:
    - name: searches for cancer cases
      params:
        size: 3
      assert:
        - path: data.hits
          minLength: 1
        - path: data.hits.0.case_id
  searchProjects:
    - name: lists cancer research projects
      params:
        size: 3
      assert:
        - path: data.hits
          minLength: 1
        - path: data.hits.0.project_id
  searchGenes:
    - name: searches for genes
      params:
        size: 3
      assert:
        - path: data.hits
          minLength: 1
        - path: data.hits.0.gene_id
