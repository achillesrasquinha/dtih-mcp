name: gbif
displayName: GBIF
description: Global Biodiversity Information Facility — species occurrence and taxonomy data worldwide
tags:
  - biodiversity
  - species
  - occurrence
  - gbif
  - ecology
baseUrl: https://api.gbif.org/v1
tools:
  searchSpecies:
    description: Search GBIF for species by name or keyword
    tags:
      - species-search
      - taxonomy-search
    method: GET
    path: /species/search
    params:
      query:
        type: string
        required: true
        mapsTo: q
        description: Species name or keyword to search (e.g. "Panthera leo")
      limit:
        type: integer
        default: 5
        description: Maximum number of results to return
    response:
      format: json
      fields:
        - "count"
        - "results[].key"
        - "results[].scientificName"
        - "results[].canonicalName"
        - "results[].rank"
        - "results[].kingdom"
        - "results[].phylum"
        - "results[].family"
  getOccurrences:
    description: Search GBIF for species occurrence records by taxon key
    tags:
      - occurrence-search
      - distribution
    method: GET
    path: /occurrence/search
    params:
      taxonKey:
        type: integer
        required: true
        description: GBIF taxon key (from searchSpecies results)
      limit:
        type: integer
        default: 10
        description: Maximum number of results to return
    response:
      format: json
      fields:
        - "count"
        - "results[].key"
        - "results[].species"
        - "results[].country"
        - "results[].decimalLatitude"
        - "results[].decimalLongitude"
        - "results[].eventDate"
        - "results[].basisOfRecord"
  getSpecies:
    description: Get detailed species information by GBIF taxon key
    tags:
      - species-info
      - taxonomy-detail
    method: GET
    path: /species/{key}
    params:
      key:
        type: integer
        required: true
        description: GBIF species key
    response:
      format: json
      fields:
        - "key"
        - "scientificName"
        - "canonicalName"
        - "vernacularName"
        - "rank"
        - "kingdom"
        - "phylum"
        - "family"
tests:
  searchSpecies:
    - name: searches for Panthera leo
      params:
        query: Panthera leo
      assert:
        - path: results
          minLength: 1
        - path: results.0.scientificName
  getOccurrences:
    - name: gets occurrence records for a taxon key
      params:
        taxonKey: 5219404
      assert:
        - path: results
          minLength: 1
  getSpecies:
    - name: gets species detail by key
      params:
        key: 5219404
      assert:
        - path: species
          equals: Panthera leo
