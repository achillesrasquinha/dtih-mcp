name: glygen
displayName: GlyGen
description: GlyGen — glycoscience data integration and retrieval
tags:
  - glycomics
  - glycan
  - glycoprotein
  - glygen
  - carbohydrate
baseUrl: https://api.glygen.org
tools:
  searchGlycans:
    description: Get glycan search initialization data including organism list and mass ranges
    tags:
      - glycan-search
      - glycan-init
    method: POST
    path: /glycan/search_init/
    params: {}
    response:
      format: json
      pick:
        - "glycan_mass.native"
        - "glycan_mass.permethylated"
        - "number_monosaccharides"
        - "organism[].name"
        - "organism[].id"
        - "glycan_type"
  getProtein:
    description: Get detailed glycoprotein information by UniProt accession
    tags:
      - protein-detail
      - glycoprotein-info
    method: POST
    path: /protein/detail/{accession}/
    params:
      accession:
        type: string
        required: true
        description: UniProt accession number (e.g. P00734 for prothrombin)
    response:
      format: json
      pick:
        - "mass"
        - "gene_names[].name"
        - "gene_names[].type"
        - "protein_names[].name"
        - "protein_names[].type"
        - "refseq.ac"
        - "refseq.name"
        - "refseq.summary"
tests:
  searchGlycans:
    - name: initializes glycan search and gets available parameters
      params: {}
      assert:
        - path: organism
        - path: organism
          minLength: 1
  getProtein:
    - name: gets protein P00734 (prothrombin) details
      params:
        accession: P00734
      assert:
        - path: mass
        - path: refseq
