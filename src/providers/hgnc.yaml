name: hgnc
displayName: HGNC
description: HUGO Gene Nomenclature Committee — approved human gene symbols and names
tags:
  - gene
  - nomenclature
  - symbol
  - human
  - hgnc
baseUrl: https://rest.genenames.org
headers:
  Accept: application/json
tools:
  search:
    description: Search HGNC for gene symbols and names
    tags:
      - gene-search
      - symbol-search
    method: GET
    path: /search/{query}
    params:
      query:
        type: string
        required: true
        description: Search query (e.g. "BRCA1", "kinase")
    response:
      format: json
      pick:
        - response.docs[].symbol
        - response.docs[].hgnc_id
        - response.docs[].score
  getGene:
    description: Get gene record by approved gene symbol
    tags:
      - gene-info
      - symbol-lookup
    method: GET
    path: /fetch/symbol/{symbol}
    params:
      symbol:
        type: string
        required: true
        description: Approved gene symbol (e.g. "BRCA1", "TP53")
    response:
      format: json
      pick:
        - response.docs[].hgnc_id
        - response.docs[].symbol
        - response.docs[].name
        - response.docs[].locus_group
        - response.docs[].locus_type
        - response.docs[].location
        - response.docs[].alias_symbol
        - response.docs[].entrez_id
tests:
  search:
    - name: searches for BRCA1 gene
      params:
        query: BRCA1
      assert:
        - path: response.docs
          minLength: 1
  getGene:
    - name: gets gene record for BRCA1 symbol
      params:
        symbol: BRCA1
      assert:
        - path: response.docs
          minLength: 1
        - path: response.docs.0.symbol
          equals: BRCA1
