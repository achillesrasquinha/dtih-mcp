name: gnomad
displayName: gnomAD
description: Genome Aggregation Database — population variant frequencies and annotations
tags:
  - variants
  - population-genetics
  - allele-frequency
  - gnomad
baseUrl: https://gnomad.broadinstitute.org/api
protocol: graphql
tools:
  searchVariant:
    description: Search for gene information and variant summary by gene symbol
    tags:
      - variant-search
      - gene-lookup
    query: |
      query($geneSymbol: String!, $referenceGenome: ReferenceGenomeId!) {
        gene(gene_symbol: $geneSymbol, reference_genome: $referenceGenome) {
          gene_id
          symbol
          name
          chrom
          start
          stop
          gnomad_constraint {
            pLI
            oe_mis
            oe_mis_lower
            oe_mis_upper
            oe_lof
            oe_lof_lower
            oe_lof_upper
          }
        }
      }
    response:
      format: json
      pick:
        - gene.symbol
        - gene.name
        - gene.gene_id
        - gene.gnomad_constraint.pLI
        - gene.gnomad_constraint.oe_mis
        - gene.gnomad_constraint.oe_mis_lower
        - gene.gnomad_constraint.oe_mis_upper
        - gene.gnomad_constraint.oe_lof
        - gene.gnomad_constraint.oe_lof_lower
        - gene.gnomad_constraint.oe_lof_upper
    params:
      geneSymbol:
        type: string
        required: true
        description: Gene symbol (e.g. BRCA1, PCSK9)
      referenceGenome:
        type: string
        default: GRCh37
        description: Reference genome (GRCh37 or GRCh38)
  getVariant:
    description: Get a specific variant by its gnomAD variant ID
    tags:
      - variant-info
      - allele-frequency
    query: |
      query($variantId: String!, $dataset: DatasetId!) {
        variant(variantId: $variantId, dataset: $dataset) {
          variantId
          rsids
          exome {
            ac
            an
            af
          }
          genome {
            ac
            an
            af
          }
        }
      }
    params:
      variantId:
        type: string
        required: true
        description: Variant ID in chrom-pos-ref-alt format (e.g. 1-55516888-G-A)
      dataset:
        type: string
        default: gnomad_r2_1
        description: Dataset version (e.g. gnomad_r2_1, gnomad_r4)
tests:
  searchVariant:
    - name: searches for PCSK9 gene information
      params:
        geneSymbol: PCSK9
      assert:
        - path: gene
        - path: gene.gene_id
        - path: gene.symbol
          equals: PCSK9
  getVariant:
    - name: gets a specific variant by ID
      params:
        variantId: 1-55516888-G-A
      assert:
        - path: variant
        - path: variant.variantId
          equals: 1-55516888-G-A
