name: pdb
displayName: RCSB PDB
description: Protein Data Bank — 3D structural data for biological macromolecules
tags:
  - protein-structure
  - 3d-structure
  - x-ray
  - cryo-em
  - nmr
  - pdb
baseUrl: https://data.rcsb.org
tools:
  getEntry:
    description: Get PDB entry metadata by ID
    tags:
      - structure-info
      - entry
    method: GET
    path: /rest/v1/core/entry/{entryId}
    params:
      entryId:
        type: string
        required: true
        description: PDB entry ID (e.g. 4HHB for hemoglobin)
    response:
      format: json
      fields:
        - rcsb_id
        - struct.title
        - struct_keywords.pdbx_keywords
        - rcsb_entry_info.experimental_method
        - rcsb_entry_info.resolution_combined
        - rcsb_entry_info.molecular_weight
        - rcsb_entry_info.polymer_entity_count
        - rcsb_accession_info.deposit_date
        - rcsb_accession_info.initial_release_date
        - rcsb_primary_citation.title
  getPolymerEntity:
    description: Get polymer entity details (protein/DNA chain info)
    tags:
      - structure-info
      - polymer
      - chain
    method: GET
    path: /rest/v1/core/polymer_entity/{entryId}/{entityId}
    params:
      entryId:
        type: string
        required: true
        description: PDB entry ID (e.g. 4HHB)
      entityId:
        type: string
        required: true
        description: Entity ID (e.g. 1)
    response:
      format: json
      fields:
        - rcsb_id
        - rcsb_polymer_entity.pdbx_description
        - entity_poly.type
        - entity_poly.pdbx_seq_one_letter_code
        - entity_poly.pdbx_strand_id
        - entity_poly.rcsb_sample_sequence_length
        - rcsb_entity_source_organism[].scientific_name
        - rcsb_entity_source_organism[].ncbi_taxonomy_id
tests:
  getEntry:
    - name: gets entry for hemoglobin (4HHB)
      params:
        entryId: 4HHB
      assert:
        - anyOf:
            - struct.title
            - rcsb_entry_info
  getPolymerEntity:
    - name: gets polymer entity
      params:
        entryId: 4HHB
        entityId: "1"
      assert:
        - path: entity_poly.pdbx_seq_one_letter_code
