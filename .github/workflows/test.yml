name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - name: Registry and loader tests
        run: node --test test/registry.test.js
      - name: Provider schema validation
        run: node --test test/providers.unit.test.js

  integration:
    name: API integration tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - name: Live API tests
        run: node --test test/providers.integration.test.js
        timeout-minutes: 10
